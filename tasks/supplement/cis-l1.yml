---
- name: Product hardening | Disable core dumps for SUID programs (fs.suid_dumpable)
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: '0'
    sysctl_file: /etc/sysctl.d/91-stigready-product.conf
    sysctl_set: true
    reload: true
    state: present
  tags:
  - low_disruption
  - no_reboot_needed

- name: Gather the package facts for the supplement tasks
  ansible.builtin.package_facts:
    manager: auto
  tags:
  - always

# use_pam_wheel_group_for_su (cis, cis_server_l1; AlmaLinux 9, Rocky 9, RHEL 9 all fail it).
# The playbook creates the empty group but never writes the pam_wheel line. Only members of the
# group may su; cloud users use sudo, and the group is empty by design (CIS).
- name: Ensure the group used by pam_wheel for su exists
  ansible.builtin.group:
    name: sugroup
    state: present
  tags:
  - use_pam_wheel_group_for_su
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Restrict su to the sugroup group with pam_wheel (use_pam_wheel_group_for_su)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*auth\s+required\s+pam_wheel\.so'
    line: 'auth            required        pam_wheel.so use_uid group=sugroup'
    insertafter: '^#?\s*auth\s+required\s+pam_wheel\.so'
    state: present
  tags:
  - use_pam_wheel_group_for_su
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# ensure_journald_and_rsyslog_not_active_together (cis, EL9 and EL10; absent from EL8). journald is
# the single logging service; rsyslog stays installed and configured but not running.
- name: Stop and disable rsyslog so journald is the only active logging service
  ansible.builtin.systemd:
    name: rsyslog
    enabled: false
    state: stopped
  when: '"rsyslog" in ansible_facts.packages'
  tags:
  - ensure_journald_and_rsyslog_not_active_together
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Limit sshd user access by denying root by name (sshd_limit_user_access)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*DenyUsers\s'
    line: 'DenyUsers root'
    insertbefore: '^\s*Match\s'
    firstmatch: true
    state: present
    validate: /usr/sbin/sshd -t -f %s
  tags:
  - sshd_limit_user_access
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# EL10 (systemd 257+) ships no /etc/systemd/journald.conf, only /usr/lib/systemd/journald.conf, so the
# lineinfile tasks below failed there ("Destination /etc/systemd/journald.conf does not exist", seen in
# alma-10:cis-l1 2026-10-12; the rescue wrapper swallowed it but the build review counts the fatal).
# Create a minimal override with the [Journal] section when it is missing; force: false leaves an
# existing file (EL9) untouched.
- name: Ensure /etc/systemd/journald.conf exists with a [Journal] section (journald_storage)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf
    content: "[Journal]\n"
    force: false
    owner: root
    group: root
    mode: '0644'
  tags:
  - journald_storage
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# journald_compress / journald_storage. The playbook writes a drop-in under journald.conf.d, but
# the AlmaLinux 9 rule reads /etc/systemd/journald.conf itself. Setting both keeps the drop-in and
# satisfies a check that does not look at it.
- name: Set journald Compress=yes in journald.conf (journald_compress)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^\s*#?\s*Compress='
    line: 'Compress=yes'
    insertafter: '^\[Journal\]'
    state: present
  tags:
  - journald_compress
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Set journald Storage=persistent in journald.conf (journald_storage)
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^\s*#?\s*Storage='
    line: 'Storage=persistent'
    insertafter: '^\[Journal\]'
    state: present
  tags:
  - journald_storage
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# chronyd_run_as_chrony_user. The RHEL 9 playbook only strips an override; the AlmaLinux 9 rule
# wants -u chrony present in OPTIONS. backrefs: nothing changes when it is already there.
- name: Run chronyd as the chrony user (chronyd_run_as_chrony_user)
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/chronyd
    backrefs: true
    regexp: '^(OPTIONS=")((?!.*-u chrony)[^"]*)"'
    line: '\1\2 -u chrony"'
  when: '"chrony" in ansible_facts.packages'
  tags:
  - chronyd_run_as_chrony_user
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# AlmaLinux 9 only (its CIS benchmark differs from RHEL 9 and Rocky 9, which already pass these).
- name: Remove the rsync package (package_rsync_removed, AlmaLinux 9 CIS)
  ansible.builtin.package:
    name: rsync
    state: absent
  when: ansible_facts['distribution'] == 'AlmaLinux'
  tags:
  - package_rsync_removed
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: AIDE audit tools carry the selinux attribute (aide_check_audit_tools, AlmaLinux 9 CIS)
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^{{ item }}\s'
    line: '{{ item }} p+i+n+u+g+s+b+acl+selinux+xattrs+sha512'
  loop:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/ausearch
  - /usr/sbin/aureport
  - /usr/sbin/autrace
  - /usr/sbin/augenrules
  when:
  - ansible_facts['distribution'] == 'AlmaLinux'
  - '"aide" in ansible_facts.packages'
  tags:
  - aide_check_audit_tools
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# file_permissions_sshd_drop_in_config. Every file under sshd_config.d must be 0600 root:root. The
# playbook's own reinforce-os-defaults drop-in is written 0644, so the rule failed on rhel-10,
# alma-10 and rocky-10 CIS (and alma-9 stig). sshd reads these as root, so 0600 changes nothing.
- name: Find the sshd drop-in configuration files
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: '*.conf'
  register: stigforge_sshd_dropins
  tags:
  - file_permissions_sshd_drop_in_config
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Set sshd drop-in files to 0600 root:root (file_permissions_sshd_drop_in_config)
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
    group: root
    mode: '0600'
  loop: '{{ stigforge_sshd_dropins.files | default([]) }}'
  tags:
  - file_permissions_sshd_drop_in_config
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# systemd-journal-remote's service account (/sbin/nologin) has its home in /var/log/journal/remote. Installing the package
# (`Ensure systemd-journal-remote is installed`) after this role has turned on home creation copies /etc/skel there, leaving
# .bash_logout/.bash_profile/.bashrc at 0644 in /var/log, which file_permissions_var_log_stig forbids and the factory's
# shipped-state check failed on (stigready rhel-9:cis-l2, 2026-10-16). A nologin account needs no shell init files: remove
# them. No rule-id tag on purpose (a product fix to this role's own side effect, not a per-rule opt-out).
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Find shell init files in the systemd-journal-remote home
  ansible.builtin.find:
    paths: /var/log/journal/remote
    hidden: true
    file_type: file
    patterns:
    - .bash_logout
    - .bash_profile
    - .bashrc
    - .cshrc
    - .kshrc
    - .tcshrc
    - .zshrc
  register: stigforge_journal_remote_skel
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Remove shell init files from the systemd-journal-remote home under /var/log
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stigforge_journal_remote_skel.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# Leave auditd running. The generated rules restart auditd after editing them (`service auditd restart`, more than once per role);
# on rhel-9-arm64:cis-l2 (stigready, 2026-10-16) the second restart 14 s after the first stopped auditd and never started it. With
# the rules immutable (-e 2) and nothing reading events, the audit backlog fills and every audited syscall waits, which wedged new
# SSH sessions for an hour. Start it if needed (a no-op when running), then require a live auditd pid or fail the build.
# No rule-id tag on purpose: a product guarantee about the role's own side effects, not a per-rule opt-out.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Ensure auditd is running after the role's audit changes
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | auditd must be running (a stopped auditd with immutable rules wedges every audited syscall)
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.command: auditctl -s
  register: stigforge_auditd_status
  changed_when: false
  until: stigforge_auditd_status.stdout is regex('(?m)^pid [1-9][0-9]*$')
  retries: 12
  delay: 10
  tags:
  - low_disruption
  - no_reboot_needed
